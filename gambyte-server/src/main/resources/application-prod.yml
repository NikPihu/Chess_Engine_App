# Production overrides (AWS). Everything secret comes from environment variables.
server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}   # cookies only over HTTPS; set false only to test by IP over plain HTTP

logging:
  structured:
    format:
      console: ecs          # JSON logs, one line per event (easy to search)

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
