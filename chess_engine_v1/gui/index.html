<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChessEngineApp — board</title>
<style>
  :root { --light: #f0d9b5; --dark: #b58863; --last: rgba(205, 210, 106, .75); --sel: rgba(20, 85, 30, .5); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: #262421; color: #e8e6e3;
         display: flex; gap: 24px; justify-content: center; align-items: flex-start; padding: 24px; }
  #boardWrap { position: relative; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
           width: min(85vh, 640px); height: min(85vh, 640px);
           border-radius: 4px; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,.5); user-select: none; }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sq.light { background: var(--light); } .sq.dark { background: var(--dark); }
  .sq.last.light, .sq.last.dark { background-image: linear-gradient(var(--last), var(--last)); }
  .sq.sel { background-image: linear-gradient(var(--sel), var(--sel)) !important; }
  .sq.check { background-image: radial-gradient(circle, #ff0000 0%, rgba(231,0,0,.6) 30%, rgba(169,0,0,0) 70%) !important; }
  .coord { position: absolute; font-size: 11px; font-weight: 600; pointer-events: none; }
  .coord.rank { top: 2px; left: 3px; } .coord.file { bottom: 1px; right: 4px; }
  .sq.light .coord { color: var(--dark); } .sq.dark .coord { color: var(--light); }
  .piece { font-size: min(8.2vh, 66px); line-height: 1; cursor: grab; position: relative; z-index: 2; }
  .piece.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000, 1px 1px 2px rgba(0,0,0,.6); }
  .piece.b { color: #111; text-shadow: 0 0 1px #fff4, 1px 1px 2px rgba(0,0,0,.4); }
  .dot::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(20,85,30,.5); z-index: 1; }
  .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 6px solid rgba(20,85,30,.5); z-index: 1; }
  #promo { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); z-index: 5; }
  #promo div { background: #fff; border-radius: 6px; display: flex; gap: 4px; padding: 6px; }
  #promo button { font-size: 48px; width: 70px; height: 70px; border: 0; background: #eee; border-radius: 4px; cursor: pointer; }
  #side { width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .panel { background: #312e2b; border-radius: 6px; padding: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 13px; margin: 0 0 8px; color: #bababa; text-transform: uppercase; letter-spacing: .05em; }
  button.btn { background: #3d3a37; color: #e8e6e3; border: 1px solid #555; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
  button.btn:hover { background: #4a4643; } button.primary { background: #629924; border-color: #629924; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, input { background: #262421; color: #e8e6e3; border: 1px solid #555; border-radius: 4px; padding: 6px; }
  #fen { width: 100%; font-family: Consolas, monospace; font-size: 12px; }
  #moves { font-family: Consolas, monospace; font-size: 14px; max-height: 280px; overflow-y: auto; display: grid;
           grid-template-columns: 36px 1fr 1fr; row-gap: 2px; }
  #moves .n { color: #888; } #moves .m.cur { background: #4a4643; border-radius: 3px; }
  #status { font-weight: 600; min-height: 20px; } #info { font-family: Consolas, monospace; font-size: 11px; color: #9a9a9a; word-break: break-all; }
  label { font-size: 13px; }
</style>
</head>
<body>
<div id="boardWrap">
  <div id="board"></div>
  <div id="promo"><div id="promoChoices"></div></div>
</div>
<div id="side">
  <div class="panel">
    <h1>ChessEngineApp</h1>
    <div id="status"></div>
    <div id="info"></div>
  </div>
  <div class="panel">
    <h2>Game</h2>
    <div class="row">
      <button class="btn primary" onclick="newGame('w')">New as White</button>
      <button class="btn" onclick="newGame('b')">New as Black</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn" onclick="flip()">Flip board</button>
      <button class="btn" onclick="engineMove()">Engine move now</button>
      <button class="btn" onclick="downloadPgn()">PGN</button>
    </div>
  </div>
  <div class="panel">
    <h2>Engine</h2>
    <div class="row">
      <label><input type="checkbox" id="vsEngine" checked> Play against engine</label>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="engine" onchange="settings()"></select>
      <select id="think" onchange="settings()">
        <option value="100">0.1 s</option><option value="500">0.5 s</option>
        <option value="1000" selected>1 s</option><option value="3000">3 s</option><option value="10000">10 s</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <h2>Moves</h2>
    <div id="moves"></div>
  </div>
  <div class="panel">
    <h2>Position (FEN)</h2>
    <input id="fen">
    <div class="row" style="margin-top:8px"><button class="btn" onclick="loadFen()">Load FEN</button></div>
  </div>
</div>

<script>
const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
let state = null, selected = null, flipped = false, humanColor = 'w', busy = false, pendingPromo = null;

const sqName = i => 'abcdefgh'[i % 8] + (Math.floor(i / 8) + 1);
const sqIndex = n => (n.charCodeAt(0) - 97) + 8 * (n.charCodeAt(1) - 49);

function parseFen(fen) {
  const board = new Array(64).fill(null);
  const rows = fen.split(' ')[0].split('/');
  rows.forEach((row, r) => {
    let f = 0;
    for (const c of row) {
      if (/\d/.test(c)) { f += +c; continue; }
      board[(7 - r) * 8 + f] = { color: c === c.toUpperCase() ? 'w' : 'b', type: c.toLowerCase() };
      f++;
    }
  });
  return board;
}

async function api(path) {
  const res = await fetch(path, { method: path.startsWith('/api/state') || path.startsWith('/api/pgn') ? 'GET' : 'POST' });
  return path.startsWith('/api/pgn') ? res.text() : res.json();
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const pieces = parseFen(state.fen);
  const targets = selected ? state.legal.filter(m => m.startsWith(selected)).map(m => m.slice(2, 4)) : [];
  const last = state.lastMove ? [state.lastMove.slice(0, 2), state.lastMove.slice(2, 4)] : [];
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const rank = flipped ? row : 7 - row, file = flipped ? 7 - col : col;
      const idx = rank * 8 + file, name = sqName(idx);
      const el = document.createElement('div');
      el.className = 'sq ' + ((rank + file) % 2 ? 'light' : 'dark');
      if (last.includes(name)) el.classList.add('last');
      if (selected === name) el.classList.add('sel');
      if (state.check === name) el.classList.add('check');
      if (targets.includes(name)) el.classList.add(pieces[idx] ? 'ring' : 'dot');
      if (col === 0) el.insertAdjacentHTML('beforeend', `<span class="coord rank">${rank + 1}</span>`);
      if (row === 7) el.insertAdjacentHTML('beforeend', `<span class="coord file">${'abcdefgh'[file]}</span>`);
      const p = pieces[idx];
      if (p) {
        const span = document.createElement('span');
        span.className = 'piece ' + p.color;
        span.textContent = GLYPH[p.type];
        span.draggable = true;
        span.addEventListener('dragstart', e => { selected = name; e.dataTransfer.setData('text', name); });
        el.appendChild(span);
      }
      el.addEventListener('click', () => clickSquare(name));
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', e => { e.preventDefault(); tryMove(e.dataTransfer.getData('text'), name); });
      boardEl.appendChild(el);
    }
  }
  // side panel
  const engineSel = document.getElementById('engine');
  engineSel.innerHTML = state.engines.map(e => `<option ${e === state.engine ? 'selected' : ''}>${e}</option>`).join('');
  document.getElementById('think').value = String(state.thinkMs);
  document.getElementById('fen').value = state.fen;
  const turn = state.turn === 'w' ? 'White' : 'Black';
  document.getElementById('status').textContent =
    state.error ? state.error : state.status ? `${state.status} (${state.result})` : busy ? `${turn} to move — engine thinking…` : `${turn} to move`;
  document.getElementById('info').textContent = state.info || '';
  const movesEl = document.getElementById('moves');
  movesEl.innerHTML = '';
  for (let i = 0; i < state.san.length; i += 2) {
    movesEl.insertAdjacentHTML('beforeend', `<span class="n">${i / 2 + 1}.</span>` +
      `<span class="m ${i === state.san.length - 1 ? 'cur' : ''}">${state.san[i]}</span>` +
      `<span class="m ${i + 1 === state.san.length - 1 ? 'cur' : ''}">${state.san[i + 1] || ''}</span>`);
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

function clickSquare(name) {
  if (busy || state.status) return;
  const pieces = parseFen(state.fen);
  const p = pieces[sqIndex(name)];
  if (selected && selected !== name && state.legal.some(m => m.startsWith(selected + name))) {
    tryMove(selected, name);
  } else if (p && p.color === state.turn) {
    selected = selected === name ? null : name;
    render();
  } else {
    selected = null; render();
  }
}

function tryMove(from, to) {
  const candidates = state.legal.filter(m => m.startsWith(from + to));
  if (candidates.length === 0) { selected = null; render(); return; }
  if (candidates.length > 1) { askPromotion(from, to); return; }
  sendMove(candidates[0]);
}

function askPromotion(from, to) {
  const color = state.turn;
  const box = document.getElementById('promoChoices');
  box.innerHTML = '';
  for (const t of ['q', 'r', 'b', 'n']) {
    const b = document.createElement('button');
    b.textContent = GLYPH[t];
    b.style.color = color === 'w' ? '#fff' : '#111';
    b.style.textShadow = color === 'w' ? '0 0 2px #000' : 'none';
    b.onclick = () => { document.getElementById('promo').style.display = 'none'; sendMove(from + to + t); };
    box.appendChild(b);
  }
  document.getElementById('promo').style.display = 'flex';
}

async function sendMove(uci) {
  selected = null;
  state = await api('/api/move?uci=' + uci);
  render();
  maybeEngine();
}

async function maybeEngine() {
  if (document.getElementById('vsEngine').checked && !state.status && state.turn !== humanColor) {
    await engineMove();
  }
}

async function engineMove() {
  if (busy || state.status) return;
  busy = true; render();
  state = await api('/api/engine-move');
  busy = false; render();
}

async function newGame(color) {
  humanColor = color; flipped = color === 'b'; selected = null;
  state = await api('/api/new');
  render();
  maybeEngine();
}

async function undo() {
  if (busy) return;
  state = await api('/api/undo');
  // When playing the engine, take back its reply too so it is your move again.
  if (document.getElementById('vsEngine').checked && state.turn !== humanColor && state.san.length) {
    state = await api('/api/undo');
  }
  selected = null; render();
}

function flip() { flipped = !flipped; render(); }

async function settings() {
  const engine = document.getElementById('engine').value, ms = document.getElementById('think').value;
  state = await api(`/api/settings?engine=${encodeURIComponent(engine)}&thinkMs=${ms}`);
  render();
}

async function loadFen() {
  const fen = document.getElementById('fen').value;
  state = await api('/api/new?fen=' + encodeURIComponent(fen));
  humanColor = state.turn; flipped = humanColor === 'b'; selected = null;
  render();
}

async function downloadPgn() {
  const white = humanColor === 'w' ? 'You' : state.engine, black = humanColor === 'b' ? 'You' : state.engine;
  const pgn = await api(`/api/pgn?white=${encodeURIComponent(white)}&black=${encodeURIComponent(black)}`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([pgn], { type: 'text/plain' }));
  a.download = 'game.pgn'; a.click();
}

(async () => { state = await api('/api/state'); render(); })();
</script>
</body>
</html>
