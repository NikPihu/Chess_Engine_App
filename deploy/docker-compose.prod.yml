# Production stack for one server (e.g. an AWS EC2 instance). See docs/RUNBOOK.md.
#
#   cp deploy/.env.example deploy/.env      # fill in the values
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Database options:
#   - Default: Postgres and Redis run here too (profile "local-db" is on by default via COMPOSE_PROFILES).
#   - Free hosted ones (Neon Postgres, Upstash Redis): set DATABASE_URL / REDIS_URL in .env and
#     remove "local-db" from COMPOSE_PROFILES, which saves ~300 MB of RAM on a 1 GB machine.
name: gambyte

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data        # TLS certificates
      - caddy-config:/config
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/gambyte}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx384m -XX:+UseSerialGC}
    volumes:
      - ${SYZYGY_HOST_PATH:-./syzygy}:/syzygy:ro   # optional endgame tablebases
    mem_limit: ${SERVER_MEM_LIMIT:-640m}

  postgres:
    image: postgres:17-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: gambyte
      POSTGRES_USER: ${DATABASE_USER:-gambyte}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 192m

  redis:
    image: redis:7-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 96m

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
